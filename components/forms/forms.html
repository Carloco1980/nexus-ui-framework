<form
    class="nx-form"
    data-nx-form>

    <div class="nx-form-grid">

        <div class="nx-form-field">

            <label
                class="nx-label"
                for="name">

                Nombre

            </label>

            <input
                id="name"
                class="nx-input"
                type="text"
                placeholder="Ingrese su nombre">

            <small class="nx-help">

                Campo obligatorio.

            </small>

        </div>

        <div class="nx-form-field">

            <label
                class="nx-label"
                for="email">

                Correo electrónico

            </label>

            <input
                id="email"
                class="nx-input"
                type="email"
                placeholder="correo@ejemplo.cl">

        </div>

        <div class="nx-form-field nx-form-field-full">

            <label
                class="nx-label"
                for="message">

                Mensaje

            </label>

            <textarea
                id="message"
                class="nx-textarea"
                placeholder="Escriba su mensaje">

            </textarea>

        </div>

    </div>

    <button
        class="nx-button nx-button-primary"
        type="submit">

        Enviar

    </button>

    <div
        class="nx-form-status"
        aria-live="polite">

    </div>

</form>
