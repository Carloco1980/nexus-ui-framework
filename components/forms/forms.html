<form class="nx-form">

    <div class="nx-contact-fields">

        <div class="nx-form-field">

            <label for="name">
                Nombre
            </label>

            <input
                id="name"
                type="text"
                placeholder="Ingrese su nombre">

        </div>

        <div class="nx-form-field">

            <label for="email">
                Correo electrónico
            </label>

            <input
                id="email"
                type="email"
                placeholder="correo@ejemplo.cl">

        </div>

        <div class="nx-form-field nx-form-field-full">

            <label for="message">
                Mensaje
            </label>

            <textarea
                id="message"
                rows="6"
                placeholder="Escriba su mensaje">
            </textarea>

        </div>

    </div>

    <button
        class="nx-button nx-button-primary"
        type="submit">

        Enviar

    </button>

    <div
        class="nx-form-status"
        aria-live="polite">

    </div>

</form>
