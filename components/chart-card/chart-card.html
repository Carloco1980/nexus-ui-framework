<article class="nx-panel nx-chart-card">

    <header class="nx-panel-header">

        <div class="nx-panel-heading">

            <h3 class="nx-panel-title">
                Proyectos por año
            </h3>

            <p class="nx-panel-subtitle">
                Innovación e Investigación
            </p>

        </div>

        <button
            class="nx-panel-action"
            aria-label="Opciones">

            ⋯

        </button>

    </header>

    <div class="nx-panel-body">

        <!-- Chart -->

        <div class="nx-chart-body">

            <canvas id="demoChart"></canvas>

        </div>

        <!-- Divider -->

        <div class="nx-chart-divider"></div>

        <!-- Metrics -->

        <div class="nx-chart-metrics">

            <div class="nx-chart-metric">

                <span class="nx-chart-label">
                    Total
                </span>

                <strong class="nx-chart-value">
                    234
                </strong>

            </div>

            <div class="nx-chart-metric">

                <span class="nx-chart-label">
                    Periodo
                </span>

                <strong class="nx-chart-value">
                    2012–2025
                </strong>

            </div>

            <div class="nx-chart-metric">

                <span class="nx-chart-label">
                    Estado
                </span>

                <strong class="nx-chart-value">
                    Activo
                </strong>

            </div>

        </div>

    </div>

    <footer class="nx-panel-footer">

        <span class="nx-chart-legend">
            234 registros
        </span>

        <span class="nx-chart-update">
            Actualizado hoy
        </span>

    </footer>

</article>
