<article class="nx-chart-card">

    <header class="nx-chart-header">

        <div class="nx-chart-heading">

            <h3 class="nx-chart-title">
                Proyectos por Año
            </h3>

            <p class="nx-chart-subtitle">
                Innovación e Investigación
            </p>

        </div>

        <button
            class="nx-panel-action"
            aria-label="Opciones">

            ⋯

        </button>

    </header>

    <div class="nx-chart-body">

        <canvas id="chart-demo"></canvas>

    </div>

    <footer class="nx-chart-footer">

        <span class="nx-chart-legend">
            Datos institucionales
        </span>

        <span class="nx-chart-update">
            Actualizado hoy
        </span>

    </footer>

</article>
