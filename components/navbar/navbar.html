<!--=====================================================
Nexus UI Framework
Component: Navbar
======================================================-->

<header class="nx-header">

    <div class="nx-container">

        <nav
            class="nx-navbar"
            aria-label="Main Navigation">

            <!--=========================================
            Brand
            ==========================================-->

            <a
                href="/"
                class="nx-navbar-brand"
                aria-label="Nexus UI Framework">

                <div class="nx-logo-mark">

                    N

                </div>

                <div class="nx-logo-content">

                    <span class="nx-logo-title">

                        NEXUS

                    </span>

                    <span class="nx-logo-subtitle">

                        UI Framework

                    </span>

                </div>

            </a>

            <!--=========================================
            Navigation
            ==========================================-->

            <ul class="nx-navbar-menu">

                <li>

                    <a
                        href="#hero"
                        class="active">

                        Inicio

                    </a>

                </li>

                <li>

                    <a href="#components">

                        Componentes

                    </a>

                </li>

                <li>

                    <a href="#templates">

                        Templates

                    </a>

                </li>

                <li>

                    <a href="#documentation">

                        Documentación

                    </a>

                </li>

                <li>

                    <a href="#roadmap">

                        Roadmap

                    </a>

                </li>

            </ul>

            <!--=========================================
            Actions
            ==========================================-->

            <div class="nx-navbar-actions">

                <!-- Search -->

                <input
                    type="search"
                    class="nx-navbar-search"
                    placeholder="Buscar componentes..."
                    aria-label="Buscar">

                <!-- Theme -->

                <button
                    class="nx-navbar-theme"
                    type="button"
                    aria-label="Cambiar tema">

                    ☀

                </button>

                <!-- GitHub -->

                <a
                    href="https://github.com/Carloco1980/nexus-ui-framework"
                    target="_blank"
                    rel="noopener"
                    class="nx-btn nx-btn-outline">

                    GitHub

                </a>

            </div>

            <!--=========================================
            Mobile Toggle
            ==========================================-->

            <button
                class="nx-mobile-button"
                type="button"
                aria-label="Abrir menú">

                ☰

            </button>

        </nav>

    </div>

</header>
